{% if field.is_hidden %}
  {{ field }}
{% else %}
  <div class="form-group-custom{% if field.errors %} has-error{% endif %}">
    {% if field.label %}
      <label for="{{ field.id_for_label }}" class="form-label-custom">
        {{ field.label }}
        {% if field.field.required %}<span class="req">*</span>{% endif %}
      </label>
    {% endif %}
    <div class="form-control-wrapper">
      {{ field }}
    </div>
    {% if field.errors %}
      <div class="form-error-custom">
        {% for error in field.errors %}
          <div><i class="bi bi-exclamation-circle" aria-hidden="true"></i> {{ error }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% if field.help_text %}
      <div class="form-help-custom">{{ field.help_text|safe }}</div>
    {% endif %}
  </div>
{% endif %}
